<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>情绪配图</title>
    <style>
      html, body { background: #f6f7f9; color: #1c1e21; }
      body { margin: 0; font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
    </style>
    <link rel="stylesheet" href="./style.css?v=7911aa19" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>情绪配图</h1>
        <p class="sub">给鱼鱼的回复配图：先上传图片并标注情绪，鱼鱼说到对应情绪时会按概率附图。</p>
      </header>

      <section class="card">
        <div class="meta">上传图片</div>
        <div class="row">
          <label>情绪
            <select id="uploadEmotion"></select>
          </label>
          <label>标签（可选）
            <input id="uploadTags" type="text" placeholder="猫, 搞笑, 表情包" />
          </label>
          <label>图片
            <input id="fileInput" type="file" accept="image/*" />
          </label>
          <button id="uploadBtn" type="button">上传</button>
        </div>
        <div class="hint">支持 png / jpg / gif / webp / bmp，单张建议不超过 2MB。</div>
      </section>

      <div id="status" class="status"></div>

      <section>
        <div class="meta">图库（<span id="imageCount">0</span> 张，从未使用 <span id="neverUsed">0</span>）</div>
        <div class="row">
          <input id="searchInput" type="text" placeholder="搜情绪 / 文件名 / 标签" />
          <select id="tagSelect"><option value="">全部标签</option></select>
          <button id="searchBtn" type="button">搜索</button>
          <button id="selectAllBtn" type="button">全选本页</button>
          <button id="bulkDeleteBtn" type="button">删除选中</button>
          <button id="trashBtn" type="button">回收站（<span id="trashCount">0</span>）</button>
          <details class="more">
            <summary>更多</summary>
            <div class="more-menu">
              <button id="backupBtn" type="button">整包备份</button>
              <button id="restoreBackupBtn" type="button">从最新备份恢复</button>
              <button id="exportBtn" type="button">导出索引</button>
              <label class="file-label">导入索引（仅元数据）
                <input id="importInput" type="file" accept="application/json" hidden />
              </label>
            </div>
          </details>
        </div>
        <div id="grid" class="grid"></div>
        <div class="row center pager">
          <button id="prevPage" type="button">上一页</button>
          <span id="pageInfo" class="hint"></span>
          <button id="nextPage" type="button">下一页</button>
          <button id="loadMore" type="button">加载更多</button>
        </div>
        <div id="trashBox" class="list"></div>
      </section>

      <section class="card">
        <div class="meta">情绪关键词</div>
        <div class="hint">鱼鱼的回复里出现任意关键词，就认为命中了这个情绪。多个词用逗号分隔。</div>
        <div id="emotionList" class="list"></div>
        <div class="row center">
          <label>新情绪
            <input id="newEmotion" type="text" placeholder="例如 得意" />
          </label>
          <button id="addEmotion" type="button">添加</button>
        </div>
      </section>
    </div>
    <script src="./app.js?v=20b0d62d" defer></script>
  </body>
</html>
